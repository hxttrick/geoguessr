<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Club Tags!</title>
</head>

    <div id="container">
        <div id="tag" class="glowing" contenteditable="plaintext-only" spellcheck="false">BTBC</div>
    </div>

    <ul id="contextmenu">
        <li id="exports">
            <ul>
                <li>
                    <img id="download" src="download.svg" draggable="false">
                </li>
                <li>
                    <img id="copy" src="copy.svg" draggable="false">
                </li>
                <li>
                    <img id="resize" src="resize.svg" draggable="false">
                </li>
            </ul>
        </li>
        <li id="styles">
            <ul>
                <li class="purple">
                    <span>#</span>
                </li>
                <li class="bronze">
                    <span>#</span>
                </li>
                <li class="silver">
                    <span>#</span>
                </li>
                <li class="gold">
                    <span>#</span>
                </li>
                <li class="ruby">
                    <span>#</span>
                </li>
                <li class="glowing">
                    <span>#</span>
                </li>
                <li class="pearl">
                    <span>#</span>
                </li>
                <li class="obsidian">
                    <span>#</span>
                </li>
            </ul>
        </li>
    </ul>

    <style>
        @font-face {
            font-family: "ggFont";
            src: url("./ggFont-Bold.woff2") format("woff2");
            font-weight: normal;
            font-style: normal;
        }

        @font-face {
            font-family: "ggFont-thin";
            src: url("./ggFont-thin.woff2") format("woff2");
            font-weight: thin;
            font-style: normal;
        }

        @property --obsidian-border-angle {
            syntax:"<angle>";
            initial-value:0deg;
            inherits:false
        }
        @keyframes obsidian-border-rotate {
            to {
                --obsidian-border-angle:360deg
            }
        }

        @keyframes pearl-rays {
            0% {
                transform:translate(-100%, -100%)
            }
            to {
                transform:translate(100%, 100%)
            }
        }

        @keyframes copied {
            0% {
                visibility: visible;
                width: var(--icon-size);
                opacity: 1;
                border-radius: .25em;
            }
            to {
                visibility: visible;
                width: calc(var(--icon-size) * 1.618);
                opacity: 0;
                border-radius: calc(.25em + .25em * 1.618);
            }
        }

        [contenteditable]:focus {
            outline: none;
        }

        #container {
            scale: 4;
        }

        #tag {
            width: fit-content;

            font-family: "ggFont", sans-serif;

            font-size: 12px;

            padding: .2em .35em;

            border-radius: .25em;

            box-sizing: border-box;
            font-weight: 900;
            line-height: 1;
            text-transform: uppercase;

            color: oklch(from #10101c l c h);
        }

        .purple {
            background: oklch(from #bdb5ff l c h);
            color: color-mix(in oklch, oklch(from #393273 l c h) 50%, oklch(from #10101c l c h));
        }

        .bronze {
            background: linear-gradient(141deg in oklch,oklch(from #b48c6e l c h) 15%,oklch(from #96735a l c h) 30%,oklch(from #c8a082 l c h) 50%,oklch(from #aa8269 l c h) 60%,oklch(from #a07d64 l c h) 80%,oklch(from #be9678 l c h) 90%);
        }

        .silver {
            background: linear-gradient(141deg in oklch,oklch(from #c0c0c0 l c h) 15%,oklch(from #a9a9a9 l c h) 30%,oklch(from #dcdcdc l c h) 50%,oklch(from #c0c0c0 l c h) 60%,oklch(from #c0c0c0 l c h) 80%,oklch(from #f0f0f0 l c h) 90%);
        }

        .gold {
            background: linear-gradient(141deg in oklch,oklch(from #d4af37 l c h) 15%,oklch(from #b78726 l c h) 30%,oklch(from #ffdf64 l c h) 50%,oklch(from #daa520 l c h) 60%,oklch(from #d4af37 l c h) 80%,oklch(from #ffd700 l c h) 90%);
            text-shadow: 0 .0625em 0 rgba(255,255,255,.25);
        }

        .glowing {
            border: .0625rem solid rgba(0,0,0,0);
            background: 
                linear-gradient(135deg,#121727,#1e2a4d) padding-box,
                linear-gradient(180deg,rgb(25,31,48) 52%,rgb(17,30,68) 85%) border-box;
            color: white !important;
            text-shadow: 
                0 0 .15rem #00a2fe,
                0 0 .50625rem #00a2fe;
            box-shadow: 
                inset 0 1px 0 0 oklch(from #fff l c h  / 20%), 
                inset 0 0 0 1px oklch(from #fff l c h  / 10%), 
                0 4px 8px 0 oklch(from #10101c l c h  / 40%);
        }

        .pearl {
            position: relative;
            overflow: clip;
            background: radial-gradient(ellipse 80% 60% at 50% 25%,white 20%,transparent 40%),radial-gradient(circle at 50% 35%,#938b80 50%,#f2efe9 100%);

            &::after {
                content: "";
                position: absolute;
                inset: -50%;
                z-index: 20;
                border-radius: inherit;
                background: linear-gradient(180deg,transparent 30%,rgba(255,255,255,.5) 54%,transparent 78%);
                pointer-events: none;
                animation: pearl-rays 10s cubic-bezier(.7, 0, .3, 1) infinite both;
            }
        }

        .obsidian {
            border: .0625rem solid rgba(0,0,0,0);
            background: linear-gradient(126deg,rgb(6,8,14) 0,rgb(30,36,50) 28%,rgb(94,111,135) 47%,rgb(18,22,32) 62%,rgb(2,3,7) 100%) padding-box,linear-gradient(var(--obsidian-border-angle),rgb(4,7,13) 0,rgb(114,137,171) 38%,rgb(198,221,245) 50%,rgb(55,71,102) 68%,rgb(4,7,13) 100%) border-box;
            color: oklch(from #fff l c h) !important;
            text-shadow: 0 .0625em 0 rgba(0,0,0,.8);
            animation: obsidian-border-rotate 9s linear infinite;
        }

        .pearl-rework {
            background:
                radial-gradient(circle at 50% 35%,rgb(197, 218, 245) 50%, rgb(174, 161, 248) 100%) border-box,
                radial-gradient(
                    farthest-side at 0% 100%,
                    rgb(207, 207, 248) 0%,
                    rgb(182, 226, 255) 25%,
                    rgb(255, 232, 250) 50%,
                    rgb(232, 230, 255) 75%,
                    rgb(210, 210, 255) 100%
                ) padding-box,
                radial-gradient(
                    farthest-corner at 100% 100%,
                    rgb(230, 230, 255) 0%,
                    rgb(232, 230, 255) 25%,
                    rgb(243, 216, 239) 50%,
                    rgb(231, 243, 252) 75%,
                    rgb(219, 219, 255) 100%
                ) padding-box,
                linear-gradient(oklch(from #fff l c h  / 30%)) border-box;

            background-blend-mode: color-burn;

            border: .0625rem solid rgba(0,0,0,0);

            &::after {
                animation-delay: -3s;
            }
        }

        .ruby {
            border: .0625rem solid rgba(0,0,0,0);
            background: linear-gradient(100.4deg,#d21974,#b41563 16.07%,#dc405e 49.14%,#b41563 79.2%,#d21974 96.92%) padding-box,linear-gradient(180deg,rgb(251,141,196) 40%,#b41563 85.42%) border-box;
            box-shadow: inset 0 4px 6px 0 rgba(255,255,255,.35);
            color: oklch(from #10101c l c h) !important;
        }

        * {
            margin: 0;
            padding: 0;
            list-style: none;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: #48484c white;
        }

        #contextmenu {
            display: grid;
            grid-template-columns: repeat(3, 1fr);

            position: absolute;
            width: max-content;
            min-width: fit-content;

            visibility: hidden;
            overflow: hidden;
            background-color: white;
            box-shadow: 0 0 8px rgba(0, 0, 0, 0.2);
            border-radius: 8px;
            font-family: 'ggFont-thin', sans-serif;

            --icon-size: 1.5em;
            --icon-padding: .5rem;

            & > li {
                display: grid;
                grid-template-columns: subgrid;
                grid-column: 1 / -1;

                & > ul {
                    display: grid;
                    grid-template-columns: subgrid;
                    grid-column: 1 / -1;
                }
            }

            #exports > ul {
                li {
                    display: grid;
                    width: calc(var(--icon-size) + 2 * var(--icon-padding));
                    height: calc(var(--icon-size) + 2 * var(--icon-padding));
                    position: relative;

                    &:has([triggered='true'])::after {
                        content: '';
                        position: absolute;
                        aspect-ratio: 1;
                        border: 2px solid #eee;
                        box-sizing: border-box;
                        place-self: center;
                        pointer-events: none;
                        visibility: hidden;
                        animation: copied 400ms ease-out;
                    }
                }

                img {
                    place-self: center;
                    width: var(--icon-size);
                    height: var(--icon-size);

                    cursor: pointer;
                    border-radius: .25em;
                    
                    &:hover {
                        background: #eee;
                    }
                }

                #resize {
                    cursor: ew-resize;
                    user-select: none;

                    &:hover {
                        background: transparent;
                    }
                }
            }

            #styles > ul {
                background: #f7f7f7;

                li {
                    width: var(--icon-size);
                    height: var(--icon-size);
                    margin: calc(var(--icon-padding));
                    border-radius: .25em;
                    box-sizing: border-box;
                    position: relative;
                    cursor: pointer;

                    span {
                        position: absolute;
                        left: 50%;
                        top: 50%;
                        transform: translate(-50%, -50%);
                    }
                }
            }
        }
    </style>

    <script src="https://cdn.jsdelivr.net/npm/html-to-image@1.11.13/dist/html-to-image.js"></script>
    <script>
        const handle = document.querySelector("#resize");
        const tag = document.querySelector("#tag");

        document.addEventListener("contextmenu", (e) => {
            e.preventDefault();

            document.querySelectorAll('#exports img').forEach(el => el.setAttribute('triggered', false));

            const menu = document.querySelector('#contextmenu');

            let x = e.clientX;
            if (e.clientX + menu.offsetWidth > window.innerWidth)
                x -= menu.offsetWidth;

            let y = e.clientY;
            if (e.clientY + menu.offsetHeight > window.innerHeight)
                y -= menu.offsetHeight;

            menu.style.left = `${x}px`;
            menu.style.top = `${y}px`;
            menu.style.visibility = 'visible';
        });

        document.addEventListener("pointerdown", (e) => {
            const menu = document.querySelector("#contextmenu");

            if (!menu.contains(e.target)) {
                menu.style.visibility = "hidden";
            }
        });

        let startX, startScale, baseWidth, startWidth;

        handle.addEventListener("pointerdown", (e) => {
            if (e.button !== 0) return;

            const container = tag.parentElement;

            startX = e.clientX;
            startScale = parseFloat(getComputedStyle(container).scale);

            baseWidth = tag.clientWidth;
            startWidth = baseWidth * startScale;

            handle.setPointerCapture(e.pointerId);

            document.body.style.userSelect = "none";
            document.body.style.cursor = "ew-resize";
        });

        handle.addEventListener("pointermove", (e) => {
            if (!handle.hasPointerCapture(e.pointerId)) return;

            const deltaX = e.clientX - startX;

            const nextWidth = startWidth + deltaX;
            const nextScale = Math.max(1, Math.min(16, nextWidth / baseWidth));

            tag.parentElement.style.scale = nextScale;
        });

        handle.addEventListener("pointerup", (e) => {
            handle.releasePointerCapture(e.pointerId);

            document.body.style.userSelect = "";
            document.body.style.cursor = "";

            if(e.clientX == startX) {
                tag.parentElement.style.scale = 4;
            }
        });

        document.querySelector('#download').addEventListener('click', async () => {
            const tag = document.getElementById("tag");
            const a = document.createElement("a");
            a.href = await htmlToImage.toPng(tag, {
                backgroundColor: "transparent",
                pixelRatio: parseFloat(getComputedStyle(container).scale)
            });
            a.download = tag.textContent.trim().toLowerCase() + ".png";
            a.click();
        });

        document.querySelector('#copy').addEventListener('click', async () => {
            const tag = document.getElementById("tag");
            const blob = await htmlToImage.toBlob(tag, {
                backgroundColor: "transparent",
                pixelRatio: parseFloat(getComputedStyle(container).scale)
            });
            await navigator.clipboard.write([new ClipboardItem({ "image/png": blob })]);
        });

        document.querySelectorAll('#exports img').forEach(el => el.addEventListener('click', async (e) => {
            const target = e.currentTarget;
            if (target.id == "resize") return;
            target.setAttribute('triggered', false);
            void target.offsetWidth;
            target.setAttribute('triggered', true);
        }));

        document.querySelectorAll('#styles li').forEach(swatch => {
            swatch.addEventListener('click', (e) => {
                const tag = document.getElementById("tag");
                tag.classList = swatch.classList;
            });

            swatch.style.boxShadow = getComputedStyle(swatch).boxShadow
                .split(', ')
                .filter(shadow => shadow.includes('inset'))
                .join(', ');
        });
    </script>
</body>
</html>
